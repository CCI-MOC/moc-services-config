apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/applicationsets/

patches:
  - target:
      kind: ApplicationSet
      name: root
      namespace: argocd
    patch: |
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: overlays/kind/*
      - op: replace
        path: /spec/template/spec/syncPolicy/automated/prune
        value: true
      # Point ArgoCD at the in-cluster git server (overlays/kind/argocd)
      # instead of GitHub, so the Kind cluster deploys the working copy.
      - op: replace
        path: /spec/generators/0/git/repoURL
        value: &repoURL git://git-server.argocd.svc.cluster.local/repo
      - op: replace
        path: /spec/template/spec/source/repoURL
        value: *repoURL
      # Track whatever branch is checked out rather than main.
      - op: replace
        path: /spec/generators/0/git/revision
        value: &revision HEAD
      - op: replace
        path: /spec/template/spec/source/targetRevision
        value: *revision
