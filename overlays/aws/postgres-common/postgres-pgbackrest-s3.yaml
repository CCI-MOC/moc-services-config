apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-pgbackrest-s3
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: postgres-pgbackrest-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        s3.conf: |
          [global]
          repo1-s3-key={{ .application_key_id }}
          repo1-s3-key-secret={{ .application_key }}
          repo1-cipher-pass={{ .repo1_cipher_pass }}
  dataFrom:
    - extract:
        key: b2-key/moc-services-backup-rw
  data:
    - secretKey: repo1_cipher_pass
      remoteRef:
        key: cluster/moc-services/postgres/pgbackrest-encryption-key
